  webview_flutter: ^4.13.0
  skeletonizer: ^2.1.3
  smooth_page_indicator: ^1.2.1
  carousel_slider: ^5.1.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.0
